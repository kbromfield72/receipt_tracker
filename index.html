<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181A">
<title>Receipt Vault</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Receipts">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2B28;
    --paper:#F7F5EF;
    --paper-dim:#EDEAE0;
    --charcoal:#14181A;
    --charcoal-2:#1D2224;
    --stamp:#C1443C;
    --muted:#8A8577;
    --line: rgba(43,43,40,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--charcoal);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    overscroll-behavior-y:contain;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header{
    padding:22px 20px 14px;
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid rgba(247,245,239,0.08);
  }
  header h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;font-weight:700;letter-spacing:0.02em;margin:0;
  }
  header h1 span{color:var(--stamp);}
  header .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

  main{flex:1;padding:16px 16px 100px;}

  .controls{padding:0 16px;margin-top:2px;}
  .search-row{position:relative;margin-bottom:10px;}
  .search-row input{
    width:100%;background:rgba(247,245,239,0.07);color:var(--paper);border:none;
    border-radius:9px;padding:11px 14px 11px 36px;font-family:'IBM Plex Sans';font-size:14px;
  }
  .search-row input::placeholder{color:var(--muted);}
  .search-row input:focus{outline:2px solid var(--stamp);outline-offset:1px;}
  .search-row svg{
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;color:var(--muted);pointer-events:none;
  }
  .group-toggle{
    display:flex;background:rgba(247,245,239,0.06);border-radius:9px;padding:3px;gap:3px;
  }
  .group-toggle button{
    flex:1;background:none;border:none;color:var(--muted);padding:8px 10px;border-radius:7px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:0.05em;
    text-transform:uppercase;cursor:pointer;
  }
  .group-toggle button.active{background:var(--stamp);color:var(--paper);}

  .no-results{
    margin-top:14vh;text-align:center;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;
  }

  .event-pill{
    display:inline-flex;align-items:center;gap:5px;background:rgba(193,68,60,0.14);
    color:var(--stamp);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:20px;margin-top:5px;letter-spacing:0.02em;
  }
  .status-pill{
    display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:0.02em;
  }
  .status-pill.resolved{background:rgba(90,168,110,0.16);color:#5AA86E;}
  .status-pill.pending{background:rgba(200,160,60,0.16);color:#D2A544;}
  .amount-tag{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--ink);
    flex:none;text-align:right;
  }
  .paidby{color:var(--muted);}

  .amount-field{position:relative;}
  .amount-field span{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);
    font-family:'IBM Plex Sans';font-size:15px;pointer-events:none;
  }
  .amount-field input[type="text"]{padding-left:26px;}

  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(247,245,239,0.06);border-radius:9px;padding:12px 14px;margin-top:14px;
  }
  .toggle-row span{font-family:'IBM Plex Sans';font-size:14px;}
  .switch{position:relative;width:44px;height:26px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{
    position:absolute;inset:0;background:rgba(247,245,239,0.18);border-radius:20px;transition:background 0.15s;
  }
  .switch .track:before{
    content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--paper);
    border-radius:50%;transition:transform 0.15s;
  }
  .switch input:checked + .track{background:#5AA86E;}
  .switch input:checked + .track:before{transform:translateX(18px);}

  .empty{
    margin-top:18vh;text-align:center;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;
  }
  .empty b{color:var(--paper);display:block;font-size:16px;margin-bottom:6px;font-family:'IBM Plex Sans';}

  .month-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--muted);margin:18px 4px 8px;
  }
  .month-label:first-child{margin-top:0;}

  /* Receipt card: thermal paper slip with torn/perforated bottom */
  .card{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:6px 6px 0 0;
    padding:14px 16px 20px;
    margin-bottom:22px;
    display:flex;gap:12px;align-items:center;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.28);
  }
  .card:active{transform:scale(0.99);}
  .card .zig{
    position:absolute;left:0;right:0;bottom:-9px;height:10px;
    background:
      linear-gradient(135deg, var(--paper) 25%, transparent 25%) 0 0,
      linear-gradient(225deg, var(--paper) 25%, transparent 25%) 0 0;
    background-size:14px 14px;
    background-repeat:repeat-x;
  }
  .thumb{
    width:52px;height:52px;border-radius:4px;flex:none;object-fit:cover;
    border:1px solid var(--line);
  }
  .thumb.placeholder{
    display:flex;align-items:center;justify-content:center;
    background:var(--paper-dim);color:var(--muted);font-size:20px;
  }
  .meta{flex:1;min-width:0;}
  .meta .store{font-weight:600;font-size:15px;}
  .meta .store.unknown{color:var(--muted);font-style:italic;font-weight:500;}
  .meta .dates{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);
    margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;
  }
  .stamp-badge{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:10px;
    color:var(--stamp);border:1.5px solid var(--stamp);border-radius:3px;
    padding:2px 6px;letter-spacing:0.06em;transform:rotate(-4deg);
    flex:none;
  }

  /* Floating scan button */
  .fab{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--stamp);color:var(--paper);border:none;
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;
    padding:15px 26px;border-radius:30px;display:flex;align-items:center;gap:10px;
    box-shadow:0 10px 26px rgba(193,68,60,0.45);
    max-width:560px;width:calc(100% - 68px);justify-content:center;
    z-index:20;
  }
  .fab:active{transform:translateX(-50%) scale(0.97);}
  .fab svg{width:18px;height:18px;}

  /* Overlay / sheet */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,13,0.72);z-index:40;
    display:flex;align-items:flex-end;
    opacity:0;pointer-events:none;transition:opacity 0.2s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--charcoal-2);width:100%;max-width:560px;margin:0 auto;
    border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
    padding:18px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform 0.25s ease;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:rgba(247,245,239,0.2);border-radius:2px;margin:0 auto 16px;}
  .sheet h2{font-family:'IBM Plex Mono',monospace;font-size:15px;margin:0 0 16px;letter-spacing:0.02em;}

  .preview-wrap{
    width:100%;border-radius:10px;overflow:hidden;margin-bottom:14px;
    background:var(--paper-dim);min-height:160px;display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .preview-wrap img{width:100%;display:block;max-height:340px;object-fit:contain;background:var(--paper);}
  .ocr-flag{
    position:absolute;top:8px;right:8px;background:rgba(20,24,26,0.85);color:var(--paper);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 9px;border-radius:20px;
    display:flex;align-items:center;gap:6px;
  }
  .spinner{width:10px;height:10px;border-radius:50%;border:2px solid rgba(247,245,239,0.3);border-top-color:var(--paper);animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  label{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    letter-spacing:0.08em;text-transform:uppercase;margin:14px 0 6px;
  }
  input[type="text"], input[type="date"], textarea{
    width:100%;background:var(--paper);color:var(--ink);border:none;border-radius:8px;
    padding:12px 13px;font-family:'IBM Plex Sans';font-size:15px;
  }
  input:focus, textarea:focus{outline:2px solid var(--stamp);outline-offset:1px;}
  .readonly-row{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paper);
    background:rgba(247,245,239,0.06);padding:10px 13px;border-radius:8px;margin-top:6px;
  }
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}

  .btn-row{display:flex;gap:10px;margin-top:22px;}
  button.primary, button.secondary{
    flex:1;padding:14px;border-radius:9px;border:none;font-family:'IBM Plex Mono',monospace;
    font-weight:600;font-size:13.5px;letter-spacing:0.03em;cursor:pointer;
  }
  button.primary{background:var(--stamp);color:var(--paper);}
  button.secondary{background:transparent;color:var(--muted);border:1px solid rgba(247,245,239,0.18);}
  button.danger{background:transparent;color:var(--stamp);border:1px solid rgba(193,68,60,0.5);}

  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;font-family:'IBM Plex Mono',monospace;line-height:1.6;}
  #cameraInput{display:none;}
  .close-x{
    position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);
    font-size:20px;cursor:pointer;line-height:1;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Receipt<span>·</span>Vault</h1>
    <div class="count" id="countLabel">0 receipts</div>
  </header>
  <div class="controls">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search store, event, date…">
    </div>
    <div class="group-toggle" id="groupToggle">
      <button data-mode="month" class="active">By month</button>
      <button data-mode="event">By event</button>
    </div>
  </div>
  <main id="main"></main>
  <button class="fab" id="scanBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    Scan receipt
  </button>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment">

<!-- Add / edit sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div style="position:relative;">
      <div class="sheet-handle"></div>
      <button class="close-x" id="closeSheet">&times;</button>
      <h2 id="sheetTitle">New receipt</h2>
    </div>

    <div class="preview-wrap" id="previewWrap">
      <span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;">No image</span>
    </div>

    <label>Added</label>
    <div class="readonly-row" id="addedRow">—</div>

    <div class="row2">
      <div>
        <label>Store</label>
        <input type="text" id="storeInput" list="storeList" placeholder="e.g. Tesco">
        <datalist id="storeList">
          <option value="Tesco"><option value="Asda"><option value="Sainsbury's">
          <option value="Morrisons"><option value="Aldi"><option value="Lidl">
          <option value="Waitrose"><option value="Marks & Spencer"><option value="Co-op">
          <option value="Iceland">
        </datalist>
      </div>
      <div>
        <label>Receipt date</label>
        <input type="date" id="dateInput">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>Amount</label>
        <div class="amount-field">
          <span>£</span>
          <input type="text" inputmode="decimal" id="amountInput" placeholder="0.00">
        </div>
      </div>
      <div>
        <label>Paid by</label>
        <input type="text" id="paidByInput" list="payerList" placeholder="e.g. You, Sam">
        <datalist id="payerList"></datalist>
      </div>
    </div>

    <div class="toggle-row">
      <span>Resolved / processed</span>
      <label class="switch">
        <input type="checkbox" id="resolvedInput">
        <span class="track"></span>
      </label>
    </div>

    <label>Event (optional)</label>
    <input type="text" id="eventInput" list="eventList" placeholder="e.g. Christmas, Sarah's birthday, Portugal holiday">
    <datalist id="eventList">
      <option value="Christmas"><option value="Birthday"><option value="Holiday">
      <option value="Wedding"><option value="Anniversary"><option value="New home">
      <option value="Everyday">
    </datalist>

    <label>Notes (optional)</label>
    <textarea id="notesInput" rows="2" placeholder="Anything else worth remembering"></textarea>

    <div class="hint" id="ocrHint"></div>

    <div class="btn-row">
      <button class="danger" id="deleteBtn" style="display:none;">Delete</button>
      <button class="secondary" id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Tesseract.js for on-device OCR (loaded lazily, app works fine without it) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ---------- IndexedDB ---------- */
const DB_NAME='receiptVault', STORE='receipts', META='meta', DB_VERSION=2;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE,{keyPath:'id'});
      }
      if(!db.objectStoreNames.contains(META)){
        db.createObjectStore(META,{keyPath:'key'});
      }
    };
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function getMeta(key){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(META,'readonly');
    const req=tx.objectStore(META).get(key);
    req.onsuccess=()=>res(req.result ? req.result.value : []);
    req.onerror=()=>rej(req.error);
  });
}
async function addMetaValue(key,value){
  if(!value) return;
  const list=await getMeta(key);
  if(list.some(v=>v.toLowerCase()===value.toLowerCase())) return;
  list.push(value);
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(META,'readwrite');
    tx.objectStore(META).put({key, value:list});
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
async function dbAll(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=()=>res(req.result.sort((a,b)=>b.addedAt-a.addedAt));
    req.onerror=()=>rej(req.error);
  });
}
async function dbPut(rec){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(rec);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
async function dbDelete(id){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}

/* ---------- Helpers ---------- */
const STORES=['Tesco','Asda',"Sainsbury's",'Sainsburys','Morrisons','Aldi','Lidl','Waitrose','Marks & Spencer','M&S','Co-op','Coop','Iceland'];
const SEED_EVENTS=['Christmas','Birthday','Holiday','Wedding','Anniversary','New home','Everyday'];
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function findAmount(text){
  const lines=text.split('\n');
  const moneyRe=/(?:£|\$|€)?\s*(\d{1,4}\.\d{2})\b/;
  // Prefer a line that says "total" but not "subtotal"/"sub total"/"total items"
  for(const line of lines){
    const low=line.toLowerCase();
    if(low.includes('total') && !low.includes('subtotal') && !low.includes('sub total') && !low.includes('items')){
      const m=line.match(moneyRe);
      if(m) return parseFloat(m[1]);
    }
  }
  // Fallback: largest money-like number on the receipt
  let max=null;
  const all=text.match(new RegExp(moneyRe,'g'));
  if(all){
    for(const a of all){
      const m=a.match(moneyRe);
      if(m){ const v=parseFloat(m[1]); if(max===null||v>max) max=v; }
    }
  }
  return max;
}

function findStore(text){
  const lower=text.toLowerCase();
  for(const s of STORES){
    if(lower.includes(s.toLowerCase())) return s==='Sainsburys'?"Sainsbury's":(s==='Coop'?'Co-op':s);
  }
  return null;
}
function findDate(text){
  // dd/mm/yyyy or dd-mm-yyyy or dd.mm.yyyy
  let m=text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if(m){
    let [_,d,mo,y]=m;
    if(y.length===2) y='20'+y;
    d=d.padStart(2,'0'); mo=mo.padStart(2,'0');
    if(+mo>=1 && +mo<=12 && +d>=1 && +d<=31) return `${y}-${mo}-${d}`;
  }
  // "12 Jan 2024" or "Jan 12 2024" or "12 January 2024"
  m=text.match(/\b(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})\b/);
  if(m){
    const mi=MONTHS.indexOf(m[2].slice(0,3).toLowerCase());
    if(mi>=0) return `${m[3]}-${String(mi+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  m=text.match(/\b([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})\b/);
  if(m){
    const mi=MONTHS.indexOf(m[1].slice(0,3).toLowerCase());
    if(mi>=0) return `${m[3]}-${String(mi+1).padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  }
  return null;
}
function fmtDate(iso){
  if(!iso) return null;
  const [y,m,d]=iso.split('-');
  const dt=new Date(+y,+m-1,+d);
  return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function fmtAdded(ts){
  const dt=new Date(ts);
  return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+
         dt.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function monthKey(ts){
  const dt=new Date(ts);
  return dt.toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function compressImage(file,maxDim=1400,quality=0.75){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=e=>{ img.src=e.target.result; };
    reader.onerror=reject;
    img.onload=()=>{
      let {width,height}=img;
      if(width>height && width>maxDim){ height=height*maxDim/width; width=maxDim; }
      else if(height>maxDim){ width=width*maxDim/height; height=maxDim; }
      const canvas=document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- State ---------- */
let editing=null; // record being edited, or null for new
let pendingImage=null;

const overlay=document.getElementById('overlay');
const scanBtn=document.getElementById('scanBtn');
const cameraInput=document.getElementById('cameraInput');
const previewWrap=document.getElementById('previewWrap');
const storeInput=document.getElementById('storeInput');
const dateInput=document.getElementById('dateInput');
const eventInput=document.getElementById('eventInput');
const amountInput=document.getElementById('amountInput');
const paidByInput=document.getElementById('paidByInput');
const resolvedInput=document.getElementById('resolvedInput');
const notesInput=document.getElementById('notesInput');
const searchInput=document.getElementById('searchInput');
const groupToggle=document.getElementById('groupToggle');
let groupMode='month';
let searchTerm='';
const addedRow=document.getElementById('addedRow');
const ocrHint=document.getElementById('ocrHint');
const deleteBtn=document.getElementById('deleteBtn');
const sheetTitle=document.getElementById('sheetTitle');

async function refreshDatalists(){
  const [customEvents, customPayers] = await Promise.all([getMeta('customEvents'), getMeta('customPayers')]);
  const eventList=document.getElementById('eventList');
  const payerList=document.getElementById('payerList');
  const events=[...SEED_EVENTS];
  for(const e of customEvents) if(!events.some(x=>x.toLowerCase()===e.toLowerCase())) events.push(e);
  eventList.innerHTML = events.map(e=>`<option value="${escapeHtml(e)}">`).join('');
  payerList.innerHTML = customPayers.map(p=>`<option value="${escapeHtml(p)}">`).join('');
}

scanBtn.onclick=()=>cameraInput.click();

cameraInput.onchange=async ()=>{
  const file=cameraInput.files[0];
  cameraInput.value='';
  if(!file) return;
  const dataUrl=await compressImage(file);
  openSheet(null, dataUrl);
  runOCR(dataUrl);
};

function openSheet(record, freshImage){
  editing=record;
  pendingImage = freshImage || (record ? record.image : null);
  sheetTitle.textContent = record ? 'Edit receipt' : 'New receipt';
  deleteBtn.style.display = record ? 'block' : 'none';
  storeInput.value = record ? (record.store||'') : '';
  dateInput.value = record ? (record.receiptDate||'') : '';
  eventInput.value = record ? (record.event||'') : '';
  amountInput.value = record && record.amount!=null ? record.amount.toFixed(2) : '';
  paidByInput.value = record ? (record.paidBy||'') : '';
  resolvedInput.checked = record ? !!record.resolved : false;
  notesInput.value = record ? (record.notes||'') : '';
  refreshDatalists();
  addedRow.textContent = record ? fmtAdded(record.addedAt) : fmtAdded(Date.now());
  ocrHint.textContent = '';
  renderPreview();
  overlay.classList.add('open');
}
function renderPreview(){
  if(pendingImage){
    previewWrap.innerHTML = `<img src="${pendingImage}" alt="receipt">`;
  } else {
    previewWrap.innerHTML = `<span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;">No image</span>`;
  }
}
function closeSheet(){
  overlay.classList.remove('open');
  editing=null; pendingImage=null;
}
document.getElementById('closeSheet').onclick=closeSheet;
document.getElementById('cancelBtn').onclick=closeSheet;
overlay.onclick=(e)=>{ if(e.target===overlay) closeSheet(); };

async function runOCR(dataUrl){
  if(typeof Tesseract==='undefined'){
    ocrHint.textContent='Auto-fill unavailable offline — enter store/date manually.';
    return;
  }
  const flag=document.createElement('div');
  flag.className='ocr-flag';
  flag.innerHTML='<div class="spinner"></div> reading receipt';
  previewWrap.appendChild(flag);
  ocrHint.textContent='Scanning for store name and date…';
  try{
    const {data:{text}}=await Tesseract.recognize(dataUrl,'eng');
    const store=findStore(text);
    const date=findDate(text);
    const amount=findAmount(text);
    if(store && !storeInput.value) storeInput.value=store;
    if(date && !dateInput.value) dateInput.value=date;
    if(amount!=null && !amountInput.value) amountInput.value=amount.toFixed(2);
    if(store||date||amount!=null){
      ocrHint.textContent=`Auto-filled from receipt: ${[store,date&&fmtDate(date),amount!=null&&('£'+amount.toFixed(2))].filter(Boolean).join(' · ')}. Check and edit if needed.`;
    } else {
      ocrHint.textContent='Could not read receipt details clearly — enter them manually.';
    }
  }catch(err){
    ocrHint.textContent='Auto-fill failed — enter store/date manually.';
  }finally{
    flag.remove();
  }
}

document.getElementById('saveBtn').onclick=async ()=>{
  const amountVal=parseFloat(amountInput.value);
  const rec={
    id: editing ? editing.id : 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    addedAt: editing ? editing.addedAt : Date.now(),
    receiptDate: dateInput.value || null,
    store: storeInput.value.trim() || null,
    event: eventInput.value.trim() || null,
    amount: isNaN(amountVal) ? null : amountVal,
    paidBy: paidByInput.value.trim() || null,
    resolved: resolvedInput.checked,
    notes: notesInput.value.trim() || null,
    image: pendingImage || null
  };
  await dbPut(rec);
  await Promise.all([
    addMetaValue('customEvents', rec.event),
    addMetaValue('customPayers', rec.paidBy)
  ]);
  closeSheet();
  render();
};
deleteBtn.onclick=async ()=>{
  if(!editing) return;
  await dbDelete(editing.id);
  closeSheet();
  render();
};

/* ---------- Render list ---------- */
function matchesSearch(it, term){
  if(!term) return true;
  const hay=[
    it.store||'', it.event||'', it.notes||'', it.paidBy||'',
    it.amount!=null ? it.amount.toFixed(2) : '',
    it.resolved ? 'resolved' : 'pending',
    it.receiptDate ? fmtDate(it.receiptDate) : '',
    it.receiptDate || '',
    fmtAdded(it.addedAt)
  ].join(' ').toLowerCase();
  return hay.includes(term);
}
function cardHtml(it){
  const thumb = it.image
    ? `<img class="thumb" src="${it.image}" alt="">`
    : `<div class="thumb placeholder">🧾</div>`;
  const storeLabel = it.store
    ? `<span class="store">${escapeHtml(it.store)}</span>`
    : `<span class="store unknown">Unlabeled store</span>`;
  const eventPill = (it.event && groupMode!=='event') ? `<span class="event-pill">${escapeHtml(it.event)}</span>` : '';
  const statusPill = `<span class="status-pill ${it.resolved?'resolved':'pending'}">${it.resolved?'Resolved':'Pending'}</span>`;
  const paidByLine = it.paidBy ? `<span class="paidby">Paid by ${escapeHtml(it.paidBy)}</span>` : '';
  const amountTag = it.amount!=null ? `<div class="amount-tag">£${it.amount.toFixed(2)}</div>` : '';
  return `<div class="card" data-id="${it.id}">
      ${thumb}
      <div class="meta">
        ${storeLabel}
        <div class="dates">
          <span>Added ${fmtAdded(it.addedAt)}</span>
          ${it.receiptDate ? `<span>· Receipt ${fmtDate(it.receiptDate)}</span>` : ''}
        </div>
        <div class="dates">${statusPill}${paidByLine ? ' '+paidByLine : ''}</div>
        ${eventPill ? `<div>${eventPill}</div>` : ''}
      </div>
      ${amountTag}
      <div class="zig"></div>
    </div>`;
}
async function render(){
  const all=await dbAll();
  const term=searchTerm.trim().toLowerCase();
  const items=all.filter(it=>matchesSearch(it,term));
  const main=document.getElementById('main');
  document.getElementById('countLabel').textContent = all.length+' receipt'+(all.length===1?'':'s');

  if(all.length===0){
    main.innerHTML=`<div class="empty"><b>No receipts yet</b>Tap "Scan receipt" below to photograph<br>your first one — it stays here, not in your<br>regular photo gallery.</div>`;
    return;
  }
  if(items.length===0){
    main.innerHTML=`<div class="no-results">No receipts match "${escapeHtml(searchTerm)}".</div>`;
    return;
  }

  let html='';
  if(groupMode==='month'){
    let lastGroup=null;
    for(const it of items){
      const gk=monthKey(it.addedAt);
      if(gk!==lastGroup){ html+=`<div class="month-label">${gk}</div>`; lastGroup=gk; }
      html+=cardHtml(it);
    }
  } else {
    // group by event: known events first (most recent activity), then "No event" last
    const groups=new Map();
    for(const it of items){
      const key=it.event || '__none__';
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }
    const keys=[...groups.keys()].sort((a,b)=>{
      if(a==='__none__') return 1;
      if(b==='__none__') return -1;
      return a.localeCompare(b);
    });
    for(const key of keys){
      const label = key==='__none__' ? 'No event tagged' : key;
      html+=`<div class="month-label">${escapeHtml(label)}</div>`;
      for(const it of groups.get(key)) html+=cardHtml(it);
    }
  }
  main.innerHTML=html;
  main.querySelectorAll('.card').forEach(card=>{
    card.onclick=async ()=>{
      const id=card.dataset.id;
      const rec=(await dbAll()).find(r=>r.id===id);
      if(rec) openSheet(rec,null);
    };
  });
}

searchInput.oninput=()=>{ searchTerm=searchInput.value; render(); };
groupToggle.onclick=(e)=>{
  const btn=e.target.closest('button[data-mode]');
  if(!btn) return;
  groupMode=btn.dataset.mode;
  groupToggle.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
};
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
